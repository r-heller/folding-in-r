bookdown::bs4_book:
  theme:
    primary: "#1565c0"
    bg: "#fafafa"
    fg: "#212121"
    base_font: { google: "Inter" }
    heading_font: { google: "Inter" }
    code_font: { google: "JetBrains Mono" }
  repo:
    base: https://github.com/r-heller/folding-in-r
    branch: main
  css: style/style.css
  includes:
    in_header: style/header.html
    after_body: style/after-body.html
  split_by: chapter
  # `config:` is a gitbook option. bs4_book absorbs it through ... and ignores
  # it -- the rendered pages carry no download markup and no collapse
  # behaviour from these keys, which was checked against docs/index.html.
  # `download: ["pdf", "epub"]` is dropped rather than left as decoration: it
  # read as a second, unguarded source of download links beside the probed
  # block in style/after-body.html, which is the mechanism that actually
  # builds them.
  config:
    toc:
      collapse: section
      scroll_highlight: yes

bookdown::pdf_book:
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: false
  toc_depth: 3
  includes:
    in_header: style/preamble.tex
  pandoc_args: ["--top-level-division=chapter"]

bookdown::epub_book:
  cover_image: "images/cover.png"
  stylesheet: style/style.css
  toc_depth: 3
