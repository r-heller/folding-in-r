<!-- Dark / light mode toggle (replaces Harrer's emoji with a Font Awesome glyph) -->
<div class="sticky-item">
  <button type="button" id="mode-switch" class="btn-circle-mode" aria-label="Toggle dark mode">
    <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
  </button>
</div>

<script>
  (function () {
    var stored = localStorage.getItem('themeMode');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var initial = stored || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', initial);

    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('mode-switch');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('themeMode', next);
      });
    });
  })();
</script>

<!-- Left-sidebar Part dividers: add the roman numeral bs4_book leaves off -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // bookdown 0.47 renders "# (PART)" into the bs4_book sidebar by itself, as
    // <li class="book-part">Folding</li> — earlier versions did not, and the
    // script inherited from methods-in-r injected its own <li> keyed on
    // chapter filenames. Doing that now duplicates every divider. What is
    // still missing is the numeral, so this decorates what bookdown emits
    // rather than adding anything.
    var parts = document.querySelectorAll(".book-toc li.book-part");
    if (!parts.length) return;

    // The appendix carries a word, not a numeral, and does not advance the
    // count. Matched on the rendered text, which comes from the first line of
    // part-appendix.Rmd.
    var APPENDIX = "Reference material";
    var ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
    var n = 0;

    parts.forEach(function (li) {
      var title = li.textContent.trim();
      var kicker = title === APPENDIX ? "Appendix" : "Part " + (ROMAN[n++] || "");

      li.classList.add("part-header");
      li.textContent = "";

      var k = document.createElement("span");
      k.className = "part-kicker";
      k.textContent = kicker;
      var t = document.createElement("span");
      t.className = "part-title";
      t.textContent = title;
      li.appendChild(k);
      li.appendChild(t);
    });
  });
</script>

<!-- Right-panel "Downloads" section, injected above View source / Edit this page -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // There are TWO .book-extra blocks on each page:
    //  - sidebar one: contains #book-repo ("View book source")
    //  - right-nav one: contains #book-source + #book-edit
    // We want the latter.
    var bookSource = document.getElementById("book-source");
    var bookExtra = bookSource ? bookSource.closest(".book-extra") : null;
    if (!bookExtra || document.querySelector(".book-downloads")) return;

    var current = window.location.pathname.split("/").pop() || "index.html";
    var chapterPdf = current.replace(/\.html$/, ".pdf");
    var isLanding = current === "" || current === "index.html";

    // Every link in this block is probed before it is offered.
    //
    // The full-book link used to be written unconditionally while the chapter
    // link below it was probed -- and that asymmetry was the bug. The render
    // workflow tolerated a failed EPUB or PDF render with continue-on-error,
    // so a build could deploy green with a "Downloads" box pointing at a PDF
    // that was never produced. The workflow no longer tolerates that (it
    // asserts both artefacts exist and clear a size floor), but a link that
    // checks its own target is cheap, and the two mechanisms fail
    // independently: a deploy that partially clears gh-pages would leave the
    // assertion satisfied and the link dead.
    //
    // Front and back matter -- Impressum, Acknowledgments, Colophon -- are
    // skipped by scripts/render-chapter-pdfs.R, so the per-chapter file is
    // often legitimately absent. Probing beats keeping a second copy of that
    // skip list here in sync with the R script.

    var TARGETS = [
      { href: "folding-in-r.pdf",
        id:   "book-download-full",
        text: "Entire book (PDF) ",
        icon: "fa-solid fa-book",
        skip: false },
      { href: "pdf-chapters/" + chapterPdf,
        id:   "book-download-chapter",
        text: "This chapter (PDF) ",
        icon: "fa-solid fa-file-pdf",
        skip: isLanding }
    ];

    var exists = function (t) {
      if (t.skip) return Promise.resolve(false);
      return fetch(t.href, { method: "HEAD" })
        .then(function (r) { return r.ok; })
        .catch(function () { return false; });
    };

    Promise.all(TARGETS.map(exists)).then(function (found) {
      // Resolved together rather than appended as each probe lands, so the
      // order is the order of TARGETS and not the order of the network.
      var live = TARGETS.filter(function (t, i) { return found[i]; });
      if (!live.length) return;              // nothing to offer, no empty box
      if (document.querySelector(".book-downloads")) return;

      var wrap = document.createElement("div");
      wrap.className = "book-downloads";

      var heading = document.createElement("h6");
      heading.className = "book-downloads-heading";
      heading.textContent = "Downloads";
      wrap.appendChild(heading);

      var list = document.createElement("ul");
      list.className = "list-unstyled";

      live.forEach(function (t) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.id = t.id;
        a.href = t.href;
        a.textContent = t.text;
        var icon = document.createElement("i");
        icon.className = t.icon;
        a.appendChild(icon);
        li.appendChild(a);
        list.appendChild(li);
      });

      wrap.appendChild(list);
      bookExtra.parentNode.insertBefore(wrap, bookExtra);
    });
  });
</script>
