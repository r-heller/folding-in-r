<!-- Dark / light mode toggle (replaces Harrer's emoji with a Font Awesome glyph) -->
<div class="sticky-item">
  <button type="button" id="mode-switch" class="btn-circle-mode" aria-label="Toggle dark mode">
    <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
  </button>
</div>

<script>
  (function () {
    var stored = localStorage.getItem('themeMode');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var initial = stored || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', initial);

    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('mode-switch');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('themeMode', next);
      });
    });
  })();
</script>

<!-- Left-sidebar Part dividers: add the roman numeral bs4_book leaves off -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // bookdown 0.47 renders "# (PART)" into the bs4_book sidebar by itself, as
    // <li class="book-part">Folding</li> — earlier versions did not, and the
    // script inherited from methods-in-r injected its own <li> keyed on
    // chapter filenames. Doing that now duplicates every divider. What is
    // still missing is the numeral, so this decorates what bookdown emits
    // rather than adding anything.
    var parts = document.querySelectorAll(".book-toc li.book-part");
    if (!parts.length) return;

    // The appendix carries a word, not a numeral, and does not advance the
    // count. Matched on the rendered text, which comes from the first line of
    // part-appendix.Rmd.
    var APPENDIX = "Reference material";
    var ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
    var n = 0;

    parts.forEach(function (li) {
      var title = li.textContent.trim();
      var kicker = title === APPENDIX ? "Appendix" : "Part " + (ROMAN[n++] || "");

      li.classList.add("part-header");
      li.textContent = "";

      var k = document.createElement("span");
      k.className = "part-kicker";
      k.textContent = kicker;
      var t = document.createElement("span");
      t.className = "part-title";
      t.textContent = title;
      li.appendChild(k);
      li.appendChild(t);
    });
  });
</script>

<!-- Right-panel "Downloads" section, injected above View source / Edit this page -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // There are TWO .book-extra blocks on each page:
    //  - sidebar one: contains #book-repo ("View book source")
    //  - right-nav one: contains #book-source + #book-edit
    // We want the latter.
    var bookSource = document.getElementById("book-source");
    var bookExtra = bookSource ? bookSource.closest(".book-extra") : null;
    if (!bookExtra || document.querySelector(".book-downloads")) return;

    var current = window.location.pathname.split("/").pop() || "index.html";
    var chapterPdf = current.replace(/\.html$/, ".pdf");
    var isLanding = current === "" || current === "index.html";

    var wrap = document.createElement("div");
    wrap.className = "book-downloads";

    var heading = document.createElement("h6");
    heading.className = "book-downloads-heading";
    heading.textContent = "Downloads";
    wrap.appendChild(heading);

    var list = document.createElement("ul");
    list.className = "list-unstyled";

    var liBook = document.createElement("li");
    var aBook = document.createElement("a");
    aBook.id = "book-download-full";
    aBook.href = "folding-in-r.pdf";
    aBook.textContent = "Entire book (PDF) ";
    var iconBook = document.createElement("i");
    iconBook.className = "fa-solid fa-book";
    aBook.appendChild(iconBook);
    liBook.appendChild(aBook);
    list.appendChild(liBook);

    wrap.appendChild(list);
    bookExtra.parentNode.insertBefore(wrap, bookExtra);

    // Front and back matter — Impressum, Acknowledgments, Colophon — are
    // skipped by scripts/render-chapter-pdfs.R, so the per-chapter link is
    // added only once the file is known to exist. Probing beats keeping a
    // second copy of the skip list here in sync with the R script.
    if (isLanding) return;
    fetch("pdf-chapters/" + chapterPdf, { method: "HEAD" }).then(function (r) {
      if (!r.ok) return;
      var liChapter = document.createElement("li");
      var aChapter = document.createElement("a");
      aChapter.id = "book-download-chapter";
      aChapter.href = "pdf-chapters/" + chapterPdf;
      aChapter.textContent = "This chapter (PDF) ";
      var iconCh = document.createElement("i");
      iconCh.className = "fa-solid fa-file-pdf";
      aChapter.appendChild(iconCh);
      liChapter.appendChild(aChapter);
      list.appendChild(liChapter);
    });
  });
</script>
