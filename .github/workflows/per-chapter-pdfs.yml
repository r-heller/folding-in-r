name: Render per-chapter PDFs (manual)

# Manual because the whole-book render already runs on every push to main and
# the two together do not fit comfortably in one job. Run this after a render
# whenever the chapter set or a chapter's anchor changes — the PDFs are named
# after the HTML page, so a changed {#anchor} silently breaks its download link
# until this runs again.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Same missing system library that kept render-book.yml from ever
      # completing a run: igraph links against GLPK and the restore dies
      # without it. setup-renv restores the whole lockfile on its own, so
      # there is no separate restore step to add here.
      - name: System libraries the pinned packages link against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libglpk-dev libpng-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Install TinyTeX (TinyTeX-2 bundle)
        run: Rscript -e 'tinytex::install_tinytex(force = TRUE, bundle = "TinyTeX-2")'

      # The script cross-checks each output name against docs/, so the rendered
      # site has to be present. Fetch what is already deployed rather than
      # re-rendering the whole book here.
      - name: Fetch the deployed site into docs/
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: docs

      - name: Render per-chapter PDFs
        run: Rscript scripts/render-chapter-pdfs.R

      - name: Sync to gh-pages /pdf-chapters
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/pdf-chapters
          target-folder: pdf-chapters
          clean: false
