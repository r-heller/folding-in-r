# Tests for the book's helper scripts in R/.
#
# This replaces an R-CMD-check workflow that checked a companion package,
# foldbench, in a sibling repository. That package was dissolved into the book
# before it was ever published: R/ holds plain scripts sourced by _common.R, so
# there is nothing to install and nothing to keep in step with the chapters.
#
# While R/ is still empty the job reports success without doing work, the same
# way the old workflow reported skipped.
name: Helper tests

on:
  push:
    branches: [main]
    paths:
      - "R/**"
      - "tests/**"
      - "scripts/build-fold-figure.R"
      - "js/fold-figure.html"
      - ".github/workflows/helpers.yml"
  pull_request:
    paths:
      - "R/**"
      - "tests/**"
      - "scripts/build-fold-figure.R"
      - "js/fold-figure.html"
      - ".github/workflows/helpers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Are there helpers to test yet?
        id: have
        run: |
          n=$(ls R/*.R 2>/dev/null | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          [ "$n" -eq 0 ] && echo "R/ holds no scripts yet — nothing to test." || true

      - uses: r-lib/actions/setup-r@v2
        if: steps.have.outputs.count != '0'
        with:
          use-public-rspm: true

      - name: Install system dependencies
        if: steps.have.outputs.count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libglpk-dev libpng-dev

      # The pinned library, not install.packages().
      #
      # This job used to delete .Rprofile and install the latest version of
      # every package it needed. That tests the helpers against a library the
      # book is never rendered with -- the whole reason renv.lock exists -- and
      # it means a test can pass here and fail in the render, or the reverse.
      # testthat is in the lockfile now, so there is nothing left that
      # justified the shortcut.
      #
      # The oldrel-1 leg of the matrix cannot use the lockfile, which pins an
      # R-version-specific library, so it is not in the matrix any more: this
      # book is rendered with one R version and pins it.
      - uses: r-lib/actions/setup-renv@v2
        if: steps.have.outputs.count != '0'

      - name: Every helper script parses and sources cleanly
        if: steps.have.outputs.count != '0'
        run: |
          helpers <- sort(list.files("R", pattern = "\\.R$", full.names = TRUE))
          for (f in helpers) source(f)
          cat("sourced", length(helpers), "helper scripts\n")
        shell: Rscript {0}

      - name: Run testthat
        if: steps.have.outputs.count != '0' && hashFiles('tests/testthat/**') != ''
        run: Rscript tests/testthat.R

      # The interactive figure's geometry is generated, and used to be generated
      # by nothing: it kept drawing a mountain/valley rule the code had already
      # retired. --check regenerates into memory and compares, so a change to
      # patterns.R or folding.R that moves the figure fails here instead of
      # shipping a figure that disagrees with the book.
      - name: js/fold-figure.html is in step with the pattern
        if: steps.have.outputs.count != '0'
        run: Rscript scripts/build-fold-figure.R --check
