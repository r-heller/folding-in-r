name: Citation Check

# The check itself lives in scripts/verify-citations.R so that CI and a local
# run ask exactly the same question. The version inherited from methods-in-r
# reimplemented it inline, against references.bib and **/*.qmd — neither of
# which exists in this book — and resolved DOIs by fetching the publisher's
# landing page, which reports the two Science DOIs here as broken because AAAS
# answers automated requests with 403.

# Runs on push as well as pull request. Work on this book lands directly on
# main, so a pull-request-only trigger meant this check had never once run.

on:
  push:
    branches: [main]
    paths:
      - 'CITATION.cff'
      - 'scripts/check-citation-cff.R'
      - 'book.bib'
      - 'packages.bib'
      - 'scripts/verify-citations.R'
      - '**/*.Rmd'
      - 'R/**'
  pull_request:
    branches: [main]
    paths:
      - 'CITATION.cff'
      - 'scripts/check-citation-cff.R'
      - 'book.bib'
      - 'packages.bib'
      - 'scripts/verify-citations.R'
      - '**/*.Rmd'
      - 'R/**'
  workflow_dispatch:

jobs:
  check-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            bibtex
            httr2
            purrr
            yaml

      - name: Resolve every identifier in book.bib
        run: Rscript scripts/verify-citations.R

      # CITATION.cff shipped with `type: book` at the top level, which CFF 1.2.0
      # does not admit -- GitHub answers an invalid type with an EMPTY citation
      # dialog rather than an error, so the surface was silently broken and
      # nothing looked wrong. This is the check that says so.
      - name: CITATION.cff is valid CFF 1.2.0
        run: Rscript scripts/check-citation-cff.R
