name: Render and deploy book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # torch is recorded in renv.lock but only Chapter 7 needs it, and it
      # pulls a large binary backend. Excluding it keeps the job inside the
      # 90-minute ceiling; see the README.
      - name: Restore the pinned library, minus torch
        run: Rscript -e 'renv::restore(exclude = "torch", prompt = FALSE)'

      # foldbench is a sibling repository. It is not needed to render the
      # scaffold — every chunk is eval = FALSE until a chapter is written — so
      # the checkout is allowed to fail and the render continues without it.
      - name: Check out foldbench
        id: foldbench
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: r-heller/foldbench
          path: .foldbench-src

      - name: Install foldbench
        if: steps.foldbench.outcome == 'success'
        run: R CMD INSTALL .foldbench-src

      - name: Install TinyTeX (TinyTeX-2 bundle — includes hyperref + common packages)
        run: Rscript -e 'tinytex::install_tinytex(force = TRUE, bundle = "TinyTeX-2")'

      - name: Top up LaTeX packages used by our preamble
        run: |
          Rscript -e 'tinytex::tlmgr_install(c(
            "hyperref","xcolor","microtype","booktabs","longtable","float",
            "fontspec","unicode-math","tipa","tex-gyre","amsmath","mathtools",
            "etoolbox","iftex","l3backend","l3kernel","l3packages","fancyvrb",
            "framed","ulem","upquote","url","koma-script","caption","listings",
            "textcomp","geometry","setspace","titling","environ","pdftexcmds",
            "infwarerr","kvoptions","ltxcmds","epstopdf-pkg","colortbl","array",
            "multirow","wrapfig","threeparttable","threeparttablex","makecell",
            "ragged2e","filehook"
          ))'
        continue-on-error: true

      - name: Render HTML (bs4_book)
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::bs4_book")'

      - name: Render EPUB
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::epub_book")'
        continue-on-error: true

      - name: Render PDF
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::pdf_book")'
        continue-on-error: true

      # bookdown knits each chapter to <name>.md under new_session and leaves
      # the result in output_dir. Build by-products, not part of the site.
      - name: Drop knit intermediates
        run: rm -f docs/*.md

      # Per-chapter PDFs are rendered by the manual workflow in
      # .github/workflows/per-chapter-pdfs.yml, which deploys them to
      # gh-pages:/pdf-chapters without clearing the rest of the branch.
      # Deploying docs/ here must therefore not clean, or it would delete them.
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true
          clean-exclude: |
            pdf-chapters
