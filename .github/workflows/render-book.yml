name: Render and deploy book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # renv::restore() below builds igraph, which links against GLPK, and
      # vegan/Matrix which want the usual headers. Without this step the
      # restore aborts before a single chapter is knitted -- which is what has
      # happened on every push to this repository so far. Run 31155400211:
      # "error testing if 'igraph' can be loaded ... libglpk.so.40: cannot open
      # shared object file". helpers.yml has carried this step since it was
      # written; render-book.yml never did, so the book has not once rendered
      # in CI.
      - name: System libraries the pinned packages link against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libglpk-dev libpng-dev

      - uses: r-lib/actions/setup-renv@v2

      # No explicit restore step. r-lib/actions/setup-renv already runs
      # renv::restore() over the whole lockfile, so the
      # `renv::restore(exclude = "torch")` that used to sit here was a no-op
      # running after the fact -- torch was installed either way. It is cheap
      # enough from the binary repository that excluding it was never buying
      # what the README claimed; the README is corrected to match.

      - name: Install TinyTeX (TinyTeX-2 bundle — includes hyperref + common packages)
        run: Rscript -e 'tinytex::install_tinytex(force = TRUE, bundle = "TinyTeX-2")'

      - name: Top up LaTeX packages used by our preamble
        run: |
          Rscript -e 'tinytex::tlmgr_install(c(
            "hyperref","xcolor","microtype","booktabs","longtable","float",
            "fontspec","unicode-math","tipa","tex-gyre","amsmath","mathtools",
            "etoolbox","iftex","l3backend","l3kernel","l3packages","fancyvrb",
            "framed","ulem","upquote","url","koma-script","caption","listings",
            "textcomp","geometry","setspace","titling","environ","pdftexcmds",
            "infwarerr","kvoptions","ltxcmds","epstopdf-pkg","colortbl","array",
            "multirow","wrapfig","threeparttable","threeparttablex","makecell",
            "ragged2e","filehook"
          ))'
        continue-on-error: true

      # packages.bib is committed, not generated at render time -- see
      # scripts/write-package-bib.R. This asserts the committed copy still
      # matches the installed versions; it never rewrites the file, so the
      # entry for torch (excluded above) is left alone rather than dropped.
      - name: packages.bib is up to date
        run: Rscript scripts/write-package-bib.R --check

      # One call, not three. Rendering each format separately re-knits all 22
      # chapters three times over, and this job already sits close to the
      # 90-minute ceiling.
      - name: Render the book in all three formats
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "all")'

      # No continue-on-error above. A failed EPUB or PDF render used to deploy
      # a green build with dead download links pointing at artefacts that were
      # never produced. A truncated PDF is as bad as a missing one, so the
      # floor is on size, not existence.
      - name: Assert both downloadable artefacts exist and are not truncated
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ ! -f "$1" ]; then
              echo "::error::$1 was not produced"; fail=1; return
            fi
            size=$(stat -c%s "$1")
            if [ "$size" -lt "$2" ]; then
              echo "::error::$1 is $size bytes, below the $2-byte floor -- truncated render"
              fail=1; return
            fi
            echo "$1 ok ($size bytes)"
          }
          check docs/folding-in-r.pdf 200000
          check docs/folding-in-r.epub 100000
          exit $fail

      # bookdown knits each chapter to <name>.md under new_session and leaves
      # the result in output_dir. Build by-products, not part of the site.
      # Dropped before the link check so lychee does not walk them.
      - name: Drop knit intermediates
        run: rm -f docs/*.md

      # The site is checked where it exists. docs/ is a build product and is
      # not tracked (see .gitignore), so there is no standalone workflow that
      # could scan it without re-rendering the whole book -- this is the one
      # job that already has it on disk.
      #
      # Internal links block the deploy: a dead relative href is a broken
      # \@ref(), a renamed anchor or a download target that was not produced,
      # and every one of those is our own bug. The sibling volume shipped 4,093
      # dead links because nothing ever looked.
      - name: Check internal links in the rendered site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --root-dir "$GITHUB_WORKSPACE/docs"
            'docs/**/*.html'
          fail: true

      # External links do not block the deploy -- a rate-limited DOI resolver
      # is not a reason to withhold the book -- but they are reported, and the
      # scheduled run in link-check.yml is what turns a report into a task.
      - name: Check external links in the rendered site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200,206,429
            --exclude-path docs/libs
            'docs/**/*.html'
          fail: false
          output: lychee-external.md

      - name: Publish the external-link report
        if: always()
        run: cat lychee-external.md >> "$GITHUB_STEP_SUMMARY" || true

      # Per-chapter PDFs are rendered by the manual workflow in
      # .github/workflows/per-chapter-pdfs.yml, which deploys them to
      # gh-pages:/pdf-chapters without clearing the rest of the branch.
      # Deploying docs/ here must therefore not clean, or it would delete them.
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true
          clean-exclude: |
            pdf-chapters
