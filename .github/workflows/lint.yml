# Chapter lint.
#
# Six structural checks over the .Rmd sources, and one of them is the reason
# the file exists: a bare decimal or comma-grouped integer in prose fails the
# build. Every number in this book is computed at render time from a committed
# artefact, or it is not made.
#
# This runs on every push and pull request and needs no R library beyond base
# R -- the script uses nothing but base, deliberately, so the gate cannot be
# blocked by a package that failed to install.
name: Lint chapters

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # renv would try to restore a library this job does not need.
      - name: Disable the renv autoloader
        run: rm -f .Rprofile

      - name: Lint the chapters
        run: Rscript scripts/lint-chapters.R

      # Base R only, and for the same reason the lint is: the check that the
      # evidence layer is intact must not be gated on a library restore. Each of
      # the book's three claims broke at a different joint of producer ->
      # artefact -> prose, and nothing checked the chain as a whole.
      - name: Every artefact has a producer, and every producer runs
        run: Rscript scripts/check-artefact-producers.R

      # The book shipped a dark mode whose search dropdown rendered at 1.40:1 and
      # whose code comments rendered at 1.90:1 -- invisible to anyone developing
      # in light mode, and undetectable by any check the repository had.
      - name: Every colour pair clears WCAG AA in both themes
        run: Rscript scripts/check-contrast.R
